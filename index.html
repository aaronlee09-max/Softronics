<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Softronics · 과천중앙고등학교</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 12% 18%, #d9edf8 0, transparent 28%),
          linear-gradient(180deg, #f7fbfe, #e8f3fb);
        color: #1e3a5f;
        font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      }
      main { text-align: center; padding: 48px 24px; max-width: 720px; }
      .logo {
        width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px;
        display: grid; place-items: center; background: #4b8ed4; color: #fff; font-weight: 800;
      }
      h1 { margin: 0 0 8px; font-size: 40px; }
      p { margin: 0 0 28px; color: #5c6b7d; }
      a {
        display: inline-block;
        background: #4b8ed4;
        color: #fff;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">GJH</div>
      <h1>Softronics</h1>
      <p>2026 학생 주도 탐구 프로젝트 가이드북</p>
      <a href="inquiry/">인터랙티브 가이드북 열기</a>
    </main>
  </body>
</html>
